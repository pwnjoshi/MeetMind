name: Build iOS App (.IPA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build MeetMind iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Full Xcode Developer Tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -list -project MeetMind.xcodeproj

      - name: Build MeetMind iOS App
        run: |
          xcodebuild build \
            -project MeetMind.xcodeproj \
            -scheme MeetMind \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE="Manual"

      - name: Package into IPA
        run: |
          mkdir -p ./build/Payload
          APP_PATH=$(find ./build/DerivedData -name "MeetMind.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: MeetMind.app was not built!"
            find ./build/DerivedData -maxdepth 5
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" ./build/Payload/
          cd ./build
          zip -r MeetMind.ipa Payload
          ls -lh MeetMind.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeetMind-iOS-App
          path: ./build/MeetMind.ipa
          retention-days: 14
