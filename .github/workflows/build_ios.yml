name: Build iOS App (.IPA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build MeetMind iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Xcode Version & SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build MeetMind Application
        run: |
          xcodebuild clean build \
            -project MeetMind.xcodeproj \
            -scheme MeetMind \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build/DerivedData \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p ./build/Payload
          APP_PATH=$(find ./build/DerivedData -name "MeetMind.app" | grep "Release-iphoneos" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: MeetMind.app not found!"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" ./build/Payload/
          cd ./build
          zip -r MeetMind.ipa Payload
          ls -lh MeetMind.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeetMind-iOS-App
          path: ./build/MeetMind.ipa
          retention-days: 14
