name: Build iOS App (.IPA)

permissions:
  contents: read

concurrency:
  group: ios-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build MeetMind iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Test offline qualification scorer (synthetic data only)
        run: python3 -m unittest discover -s Scripts -p test_evaluate_offline.py

      - name: Identify native toolchain
        id: native-toolchain
        run: echo "version=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore pinned native runtime
        uses: actions/cache@v5
        with:
          path: OfflineEngineKit/Artifacts
          key: llama-b12491-arm64-simulator-${{ runner.os }}-${{ steps.native-toolchain.outputs.version }}-${{ hashFiles('Scripts/prepare_llama.sh') }}

      - name: Prepare native runtime with simulator support
        run: bash Scripts/prepare_llama.sh

      - name: Restore compiled Swift dependencies
        uses: actions/cache@v5
        with:
          path: |
            OfflineEngineKit/.build
            build/DerivedData
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-toolchain.outputs.version }}-${{ hashFiles('OfflineEngineKit/Package.swift', 'OfflineEngineKit/Package.resolved', 'Scripts/prepare_llama.sh') }}-${{ github.sha }}
          restore-keys: |
            swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-toolchain.outputs.version }}-${{ hashFiles('OfflineEngineKit/Package.swift', 'OfflineEngineKit/Package.resolved', 'Scripts/prepare_llama.sh') }}-

      - name: Verify Xcode Environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -list -project MeetMind.xcodeproj

      - name: Create public synthetic audio for device smoke tests
        run: say -o OfflineEngineKit/Sources/OfflineEngineKit/Resources/synthetic-smoke.aiff 'Rahul will send the estimate tomorrow. We have not decided to change the design.'

      - name: Test offline engine contracts (no model downloads)
        run: swift test --package-path OfflineEngineKit

      - name: Build MeetMind iOS App
        run: |
          xcodebuild build \
            -project MeetMind.xcodeproj \
            -scheme MeetMind \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE="Manual"

      - name: Validate compiled app privacy keys
        run: python3 Scripts/validate_ipa.py build/DerivedData/Build/Products/Release-iphoneos/MeetMind.app/Info.plist

      - name: Package into IPA
        run: |
          mkdir -p ./build/Payload
          APP_PATH=./build/DerivedData/Build/Products/Release-iphoneos/MeetMind.app
          if [ -z "$APP_PATH" ]; then
            echo "Error: MeetMind.app was not built!"
            find ./build/DerivedData -maxdepth 5
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" ./build/Payload/
          cd ./build
          zip -r MeetMind.ipa Payload
          ls -lh MeetMind.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v6
        with:
          name: MeetMind-iOS-Unsigned-Requires-Resigning
          path: ./build/MeetMind.ipa
          retention-days: 14

      - name: Upload release crash symbols
        uses: actions/upload-artifact@v6
        with:
          name: MeetMind-Release-Symbols
          path: build/DerivedData/Build/Products/Release-iphoneos/MeetMind.app.dSYM
          if-no-files-found: error
          retention-days: 14

      - name: Run Swift XCTest suite
        timeout-minutes: 12
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,devices in d["devices"].items() if "iOS" in runtime for x in devices if x["name"].startswith("iPhone")))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcodebuild test \
            -project MeetMind.xcodeproj \
            -scheme MeetMind \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath ./build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 20 \
            -maximum-test-execution-time-allowance 30 \
            CODE_SIGNING_ALLOWED=NO

      - name: Smoke test onboarding and repeated main-tab launches
        if: ${{ !cancelled() && env.DEVICE_ID != '' }}
        run: bash Scripts/smoke_launch.sh "$DEVICE_ID"

      - name: Upload simulator screenshots and launch diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: MeetMind-Launch-Smoke
          path: build/smoke
          if-no-files-found: ignore

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: MeetMind-TestResults
          path: build/TestResults.xcresult
          if-no-files-found: ignore

