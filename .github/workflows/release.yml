name: Release to TestFlight

# Manual only. Tests, archives, validates and optionally uploads the exact checked-out SHA.
# Build number = this workflow's run number.
#
# Required repository secrets for every run:
#   DISTRIBUTION_CERT_P12, CERT_PASSWORD, PROVISIONING_PROFILE
# Required only when upload=true:
#   APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_P8
# See docs/appstore/pricing-and-launch.md for setup and cost details.

permissions:
  contents: read

concurrency:
  group: release-testflight
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight (untick to archive and validate without upload)"
        type: boolean
        default: true

env:
  BUNDLE_ID: com.meetmind.app
  SCHEME: MeetMind
  SOURCE_SHA: ${{ github.sha }}
  UPLOAD_REQUESTED: ${{ inputs.upload }}

jobs:
  release:
    name: Qualify, archive and upload Manent
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact clean checkout
        run: |
          set -euo pipefail
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [ "$ACTUAL_SHA" != "$SOURCE_SHA" ]; then
            echo "::error title=Wrong checkout::Expected $SOURCE_SHA but checked out $ACTUAL_SHA"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error title=Dirty checkout::Release jobs must start from a clean checkout."
            git status --short
            exit 1
          fi
          echo "Qualifying exact checkout $ACTUAL_SHA"

      - name: Block unresolved submission placeholders on upload
        run: |
          set -euo pipefail
          if [ "$UPLOAD_REQUESTED" = "true" ]; then
            python3 -X utf8 Scripts/release_tools.py check-placeholders --upload \
              docs/privacy-policy.md docs/support.md
          else
            python3 -X utf8 Scripts/release_tools.py check-placeholders \
              docs/privacy-policy.md docs/support.md
          fi

      - name: Check required release secrets
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          DISTRIBUTION_CERT_P12: ${{ secrets.DISTRIBUTION_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          missing=""
          for name in DISTRIBUTION_CERT_P12 CERT_PASSWORD PROVISIONING_PROFILE; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ "$UPLOAD_REQUESTED" = "true" ]; then
            for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_P8; do
              if [ -z "${!name}" ]; then missing="$missing $name"; fi
            done
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Missing release secrets::Add these repository secrets:$missing. See .github/workflows/release.yml and docs/appstore/pricing-and-launch.md."
            exit 1
          fi

      - name: Verify source, project and compliance metadata
        run: |
          set -euo pipefail
          mkdir -p build
          python3 -X utf8 Scripts/verify_project.py
          python3 -X utf8 Scripts/register_new_sources.py --check
          python3 -X utf8 Scripts/validate_ipa.py MeetMind/Resources/Info.plist
          git diff --check

      - name: Run all Python tests
        run: |
          set -uo pipefail
          python3 -X utf8 -m unittest discover -s Scripts -p 'test_*.py' 2>&1 | tee build/python-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then echo PASS > build/python-tests.status; else echo FAIL > build/python-tests.status; fi
          exit "$status"

      - name: Identify native toolchain
        id: native-toolchain
        run: echo "version=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore pinned native runtime
        uses: actions/cache@v5
        with:
          path: OfflineEngineKit/Artifacts
          key: llama-b12491-arm64-simulator-${{ runner.os }}-${{ steps.native-toolchain.outputs.version }}-${{ hashFiles('Scripts/prepare_llama.sh') }}

      - name: Prepare native runtime
        run: bash Scripts/prepare_llama.sh

      - name: Restore compiled Swift dependencies
        uses: actions/cache@v5
        with:
          path: |
            OfflineEngineKit/.build
            build/DerivedData
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-toolchain.outputs.version }}-${{ hashFiles('OfflineEngineKit/Package.swift', 'OfflineEngineKit/Package.resolved', 'Scripts/prepare_llama.sh') }}-${{ github.sha }}
          restore-keys: |
            swift-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-toolchain.outputs.version }}-${{ hashFiles('OfflineEngineKit/Package.swift', 'OfflineEngineKit/Package.resolved', 'Scripts/prepare_llama.sh') }}-

      - name: Verify Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -list -project MeetMind.xcodeproj

      - name: Create public synthetic audio resource
        run: say -o OfflineEngineKit/Sources/OfflineEngineKit/Resources/synthetic-smoke.aiff 'Rahul will send the estimate tomorrow. We have not decided to change the design.'

      - name: Test OfflineEngineKit contracts
        run: |
          set -uo pipefail
          swift test --package-path OfflineEngineKit 2>&1 | tee build/engine-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then echo PASS > build/engine-tests.status; else echo FAIL > build/engine-tests.status; fi
          exit "$status"

      - name: Select iOS simulator
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,devices in d["devices"].items() if "iOS" in runtime for x in devices if x["name"].startswith("iPhone")))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Run app XCTest suite
        id: app-tests
        continue-on-error: true
        timeout-minutes: 22
        run: |
          set -uo pipefail
          rm -rf build/TestResults.xcresult
          xcodebuild test \
            -project MeetMind.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath ./build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 20 \
            -maximum-test-execution-time-allowance 30 \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then echo PASS > build/app-tests.status; else echo FAIL > build/app-tests.status; fi
          exit "$status"

      - name: Smoke test onboarding and repeated launches
        id: launch-smoke
        if: always() && env.DEVICE_ID != ''
        continue-on-error: true
        timeout-minutes: 8
        run: |
          set -uo pipefail
          bash Scripts/smoke_launch.sh "$DEVICE_ID" 2>&1 | tee build/launch-smoke.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then echo PASS > build/launch-smoke.status; else echo FAIL > build/launch-smoke.status; fi
          exit "$status"

      - name: Enforce app test and launch gates
        if: always()
        run: |
          set -euo pipefail
          failed=""
          [ -f build/app-tests.status ] && [ "$(cat build/app-tests.status)" = PASS ] || failed="$failed app-XCTest"
          [ -f build/launch-smoke.status ] && [ "$(cat build/launch-smoke.status)" = PASS ] || failed="$failed launch-smoke"
          if [ -n "$failed" ]; then
            echo "::error title=Release test gates failed::$failed. Archive and upload are blocked."
            exit 1
          fi

      - name: Reconfirm exact clean source before signing
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error title=Dirty source after tests::Tracked or unignored files changed; refusing to archive."
            git status --short
            exit 1
          fi

      - name: Install signing certificate and provisioning profile
        env:
          DISTRIBUTION_CERT_P12: ${{ secrets.DISTRIBUTION_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "$DISTRIBUTION_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "$PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/dist.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          IDENTITY_LINE=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -m1 '"Apple Distribution')
          SIGNING_IDENTITY_HASH=$(echo "$IDENTITY_LINE" | awk '{print $2}')
          SIGNING_IDENTITY=$(echo "$IDENTITY_LINE" | sed -E 's/.*"([^"]+)".*/\1/')
          test -n "$SIGNING_IDENTITY_HASH"

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist")
          PROFILE_EXPIRY=$(python3 - "$RUNNER_TEMP/profile.plist" <<'PY'
          import datetime, plistlib, sys
          with open(sys.argv[1], "rb") as source:
              expiry = plistlib.load(source)["ExpirationDate"]
          now = datetime.datetime.now(datetime.timezone.utc)
          if expiry.tzinfo is None:
              expiry = expiry.replace(tzinfo=datetime.timezone.utc)
          if expiry <= now:
              raise SystemExit(f"Provisioning profile expired at {expiry.isoformat()}")
          print(expiry.astimezone(datetime.timezone.utc).isoformat())
          PY
          )
          if [ "$APP_ID" != "$TEAM_ID.$BUNDLE_ID" ]; then
            echo "::error title=Wrong provisioning profile::Profile is for '$APP_ID', expected '$TEAM_ID.$BUNDLE_ID'."
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c "Print :ProvisionedDevices" "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then
            echo "::error title=Not an App Store profile::The profile lists devices."
            exit 1
          fi
          if [ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$RUNNER_TEMP/profile.plist" 2>/dev/null || echo false)" != false ]; then
            echo "::error title=Development profile::get-task-allow must be false."
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          {
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "PROFILE_EXPIRY=$PROFILE_EXPIRY"
            echo "TEAM_ID=$TEAM_ID"
            echo "SIGNING_IDENTITY=$SIGNING_IDENTITY"
            echo "SIGNING_IDENTITY_HASH=$SIGNING_IDENTITY_HASH"
          } >> "$GITHUB_ENV"
          echo "Using '$SIGNING_IDENTITY' with profile '$PROFILE_NAME' ($PROFILE_UUID), expires $PROFILE_EXPIRY"

      - name: Install App Store Connect API key
        if: ${{ inputs.upload }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          set -euo pipefail
          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$API_KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$API_KEY_DIR"
          echo "API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "API_KEY_DIR=$API_KEY_DIR" >> "$GITHUB_ENV"
          echo "$APP_STORE_CONNECT_KEY_P8" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q "BEGIN PRIVATE KEY" "$KEY_PATH" || { echo "::error title=Bad API key::APP_STORE_CONNECT_KEY_P8 is not a base64-encoded .p8 key."; exit 1; }

      - name: Archive tested SHA with build provenance
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          rm -rf build/Manent.xcarchive build/export build/upload
          cp MeetMind/Resources/Info.plist build/Release-Info.plist
          /usr/libexec/PlistBuddy -c "Set :ManentBuildCommit $SOURCE_SHA" build/Release-Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :ManentBuildCommit string $SOURCE_SHA" build/Release-Info.plist
          xcodebuild archive \
            -project MeetMind.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Manent.xcarchive \
            -derivedDataPath ./build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY_HASH" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            INFOPLIST_FILE="$PWD/build/Release-Info.plist" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            2>&1 | tee build/xcodebuild-archive.log
          ARCHIVE_APP=$(find build/Manent.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$ARCHIVE_APP"
          cp "$ARCHIVE_APP/Info.plist" build/archive-Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :ManentBuildCommit' build/archive-Info.plist)" = "$SOURCE_SHA" || {
            echo "::error title=Missing build provenance::Archived app does not contain exact checkout SHA $SOURCE_SHA."
            exit 1
          }

      - name: Write export options
        run: |
          set -euo pipefail
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$SIGNING_IDENTITY_HASH</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          plutil -lint build/ExportOptions.plist

      - name: Export signed IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath build/Manent.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            2>&1 | tee build/xcodebuild-export.log
          IPA_COUNT=$(find build/export -maxdepth 1 -type f -name '*.ipa' | wc -l | tr -d ' ')
          [ "$IPA_COUNT" -eq 1 ] || { echo "::error title=IPA count::Expected exactly one exported IPA."; exit 1; }
          IPA_PATH=$(find build/export -maxdepth 1 -type f -name '*.ipa' -print -quit)
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Validate signed IPA, privacy manifest and provenance
        run: |
          set -uo pipefail
          rm -rf build/signed-validation
          mkdir -p build/signed-validation
          validation_status=0
          python3 -X utf8 Scripts/validate_ipa.py "$IPA_PATH" \
            --require-signing --expected-commit "$SOURCE_SHA" --expected-bundle-id "$BUNDLE_ID" || validation_status=$?
          if [ "$validation_status" -eq 0 ]; then
            ditto -x -k "$IPA_PATH" build/signed-validation || validation_status=$?
          fi
          if [ "$validation_status" -eq 0 ]; then
            SIGNED_APP=$(find build/signed-validation/Payload -maxdepth 1 -type d -name '*.app' -print -quit)
            test -n "$SIGNED_APP" || validation_status=$?
          fi
          if [ "$validation_status" -eq 0 ]; then
            codesign --verify --deep --strict --verbose=2 "$SIGNED_APP" || validation_status=$?
          fi
          if [ "$validation_status" -eq 0 ]; then
            security cms -D -i "$SIGNED_APP/embedded.mobileprovision" > build/signed-validation/profile.plist || validation_status=$?
          fi
          if [ "$validation_status" -eq 0 ]; then
            EXPORTED_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' build/signed-validation/profile.plist)
            if [ "$EXPORTED_PROFILE_UUID" != "$PROFILE_UUID" ]; then
              echo "::error title=Profile mismatch::Exported IPA uses profile $EXPORTED_PROFILE_UUID, expected $PROFILE_UUID."
              validation_status=1
            fi
          fi
          if [ "$validation_status" -eq 0 ]; then
            echo "PASS: privacy manifest, metadata, embedded SHA and cryptographic signature verified" > build/privacy-validation.status
          else
            echo "FAIL: signed IPA validation failed" > build/privacy-validation.status
          fi
          exit "$validation_status"

      - name: Upload to App Store Connect (TestFlight)
        if: ${{ inputs.upload }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app --type ios --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            2>&1 | tee build/app-store-upload.log
          echo "Uploaded exact checkout $SOURCE_SHA. App Store Connect processing happens after this gate."

      - name: Generate release summary
        if: always()
        run: |
          python3 -X utf8 Scripts/release_tools.py summary \
            --sha "$SOURCE_SHA" \
            --bundle-id "$BUNDLE_ID" \
            --signing-identity "${SIGNING_IDENTITY:-}" \
            --profile-uuid "${PROFILE_UUID:-}" \
            --profile-expiry "${PROFILE_EXPIRY:-}" \
            --ipa "${IPA_PATH:-build/export/Manent.ipa}" \
            --output build/release-summary.md
          cat build/release-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA and release summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Manent-AppStore-Release
          path: |
            build/export/*.ipa
            build/release-summary.md
            build/archive-Info.plist
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test result bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Manent-Release-TestResults
          path: build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload launch smoke screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Manent-Release-Launch-Smoke
          path: build/smoke
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload crash symbols
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Manent-Release-dSYMs
          path: |
            build/Manent.xcarchive/dSYMs
            build/DerivedData/Build/Products/**/*.dSYM
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload release logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Manent-Release-Logs
          path: |
            build/*.log
            build/*.status
            build/ExportOptions.plist
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          if [ -n "${API_KEY_PATH:-}" ]; then rm -f "$API_KEY_PATH"; fi
          if [ -n "${API_KEY_DIR:-}" ]; then rmdir "$API_KEY_DIR" 2>/dev/null || true; fi
          if [ -n "${PROFILE_UUID:-}" ]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"; fi
